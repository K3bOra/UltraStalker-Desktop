# Builds Ultra Stalker for Android TV (an APK) from this branch, with the interface of
# the Windows program (UltraStalker-Desktop v2: the website's pages + the program's
# player, adult filter and features), and tests the relay and the remote control.
name: Android TV

on:
  push:
    branches: [android-tv, 'tv/**']
  workflow_dispatch:

permissions:
  # each version is published as a release, and "tv-latest" always holds the newest APK
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Get the Windows program's interface (v2)
        uses: actions/checkout@v4
        with:
          ref: v2
          path: desktop

      - name: Which website version the program uses
        id: pin
        run: echo "ref=$(grep -oP 'ref:\s*\K[0-9a-f]{40}' desktop/.github/workflows/windows.yml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Get the website (the same version)
        uses: actions/checkout@v4
        with:
          repository: K3bOra/UltraStalker
          ref: ${{ steps.pin.outputs.ref }}
          path: desktop/ultrastalker-src
          sparse-checkout: |
            web
            worker/src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the interface
        run: |
          cd desktop && npm ci --ignore-scripts && ULTRASTALKER_DIR=ultrastalker-src npm run bundle && cd ..
          node scripts/make-site.mjs desktop

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Relay tests and the APK
        run: |
          chmod +x gradlew
          ./gradlew :relay:test :app:assembleRelease --console=plain
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/UltraStalker-TV-$v.apk"
          (cd out && sha256sum *.apk | tee "UltraStalker-TV-$v.apk.sha256.txt")

      - name: Remote-control tests (the TV's own server + Chrome)
        id: remote
        run: |
          ./gradlew :relay:serve -Pweb=$PWD/app/src/main/assets/site -Pport=47450 --console=plain > serve.log 2>&1 &
          for i in $(seq 1 90); do grep -q SERVING serve.log && break; sleep 2; done
          npm ci --ignore-scripts
          US_CHROME_PATH=$(command -v google-chrome) npm test

      - uses: actions/upload-artifact@v4
        with:
          name: UltraStalker-TV
          path: out/*
          retention-days: 30

      # Direct links for the TV (Downloader app, a browser):
      #   https://github.com/K3bOra/UltraStalker-Desktop/releases/download/tv-latest/UltraStalker-TV.apk
      # Never marked "latest": that place belongs to the Windows program's updates.
      - name: Publish the APK
        if: github.ref == 'refs/heads/android-tv' && steps.remote.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          R=$GITHUB_REPOSITORY
          if ! gh release view "tv-v$v" --repo $R > /dev/null 2>&1; then
            gh release create "tv-v$v" "out/UltraStalker-TV-$v.apk" --repo $R --target $GITHUB_SHA --latest=false \
              --title "Ultra Stalker TV $v" --notes "Ultra Stalker for Android TV $v — install over the previous version."
          fi
          cp "out/UltraStalker-TV-$v.apk" out/UltraStalker-TV.apk
          if ! gh release view tv-latest --repo $R > /dev/null 2>&1; then
            gh release create tv-latest --repo $R --target $GITHUB_SHA --latest=false --title "Ultra Stalker TV (newest)" \
              --notes "Always the newest Ultra Stalker TV: https://github.com/$R/releases/download/tv-latest/UltraStalker-TV.apk"
          fi
          gh release upload tv-latest out/UltraStalker-TV.apk --repo $R --clobber
          gh release edit tv-latest --repo $R --notes "Always the newest Ultra Stalker TV ($v): https://github.com/$R/releases/download/tv-latest/UltraStalker-TV.apk"
