# Builds Ultra Stalker for Android TV (a native app: Kotlin, Compose for TV, libVLC),
# tests the core (portals, Xtream, M3U, backups) and the screens with the remote's keys,
# and publishes the APK.
name: Android TV

on:
  push:
    branches: [android-tv, 'tv/**']
  workflow_dispatch:

permissions:
  # each version is published as a release, and "tv-latest" always holds the newest APK
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Tests (core + screens) and the APK
        id: build
        run: |
          chmod +x gradlew
          ./gradlew :relay:test :app:testDebugUnitTest -Proborazzi.test.record=true :app:assembleRelease --console=plain
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/UltraStalker-TV-$v.apk"
          (cd out && sha256sum *.apk | tee "UltraStalker-TV-$v.apk.sha256.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: UltraStalker-TV
          path: out/*
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: app/build/screens/*.png
          retention-days: 14

      # Direct links for the TV (Downloader app, a browser):
      #   https://github.com/K3bOra/UltraStalker-Desktop/releases/download/tv-latest/UltraStalker-TV.apk
      # Never marked "latest": that place belongs to the Windows program's updates.
      - name: Publish the APK
        if: github.ref == 'refs/heads/android-tv' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          R=$GITHUB_REPOSITORY
          if ! gh release view "tv-v$v" --repo $R > /dev/null 2>&1; then
            gh release create "tv-v$v" "out/UltraStalker-TV-$v.apk" --repo $R --target $GITHUB_SHA --latest=false \
              --title "Ultra Stalker TV $v" --notes "Ultra Stalker for Android TV $v — install over the previous version."
          fi
          cp "out/UltraStalker-TV-$v.apk" out/UltraStalker-TV.apk
          if ! gh release view tv-latest --repo $R > /dev/null 2>&1; then
            gh release create tv-latest --repo $R --target $GITHUB_SHA --latest=false --title "Ultra Stalker TV (newest)" \
              --notes "Always the newest Ultra Stalker TV: https://github.com/$R/releases/download/tv-latest/UltraStalker-TV.apk"
          fi
          gh release upload tv-latest out/UltraStalker-TV.apk --repo $R --clobber
          gh release edit tv-latest --repo $R --notes "Always the newest Ultra Stalker TV ($v): https://github.com/$R/releases/download/tv-latest/UltraStalker-TV.apk"
