name: Ultra Stalker Desktop Windows Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify frozen source tree
        shell: cmd
        run: python tools\source_freeze.py --root .

      - name: Verify Windows runner prerequisites
        shell: cmd
        run: |
          python --version
          where ISCC.exe
          if errorlevel 1 exit /b 1

      - name: Build and smoke-test Windows release
        shell: cmd
        run: call build_windows.bat

      - name: Verify final release bundle
        shell: cmd
        run: '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "release\VERIFY_RELEASE.ps1" -ReleaseDir "%CD%\release"'

      - name: Decode local media with bundled mpv
        shell: python
        run: |
          import math
          import pathlib
          import struct
          import subprocess
          import wave

          wav_path = pathlib.Path.cwd() / ".buildstate" / "ci-tone.wav"
          wav_path.parent.mkdir(parents=True, exist_ok=True)
          sample_rate = 8000
          seconds = 0.35
          frames = int(sample_rate * seconds)
          with wave.open(str(wav_path), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              for i in range(frames):
                  sample = int(3000 * math.sin(2 * math.pi * 440 * i / sample_rate))
                  wav.writeframesraw(struct.pack("<h", sample))

          mpv = pathlib.Path("dist") / "UltraStalkerDesktop" / "mpv.exe"
          if not mpv.is_file():
              raise SystemExit("Bundled mpv.exe is missing after the Windows build")
          result = subprocess.run(
              [
                  str(mpv),
                  "--no-config",
                  "--ao=null",
                  "--vo=null",
                  "--really-quiet",
                  "--keep-open=no",
                  str(wav_path),
              ],
              timeout=20,
              check=False,
          )
          if result.returncode != 0:
              raise SystemExit(f"Bundled mpv local decode failed: {result.returncode}")

      - name: Confirm no mpv process leaked
        shell: cmd
        run: |
          tasklist /FI "IMAGENAME eq mpv.exe" | find /I "mpv.exe" >NUL
          if not errorlevel 1 exit /b 1
          exit /b 0

      - name: Upload verified Windows release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UltraStalkerDesktop-Windows-${{ github.run_number }}
          path: release/**
          if-no-files-found: error
          retention-days: 14
