# Builds the Windows installer (UltraStalker-Setup-<version>.exe) from this branch and
# the tested interface in K3bOra/UltraStalker (web/ + the relay code).
name: Windows installer

on:
  push:
    branches: [v2, 'fix/player-controls-*']
  workflow_dispatch:

permissions:
  # v2 publishes each new version as a GitHub release: the program updates itself from it
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Get the Ultra Stalker interface
        uses: actions/checkout@v4
        with:
          repository: K3bOra/UltraStalker
          # Includes server-file cleaning, Portal/Xtream/M3U stream checks and import UI.
          ref: 5dec24a6ff21091b162d3655ba92f8d73c7672af
          path: ultrastalker-src
          sparse-checkout: |
            web
            worker/src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Bundle the interface and test the local server
        env:
          ULTRASTALKER_DIR: ultrastalker-src
        run: |
          npm run bundle
          npm test

      - name: Get VLC (ships inside the program)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://download.videolan.org/pub/videolan/vlc/last/win64/"
          $list = (Invoke-WebRequest $base -UseBasicParsing).Content
          $zip = [regex]::Match($list, 'vlc-[0-9.]+-win64\.zip').Value
          if (-not $zip) { throw "VLC download not found" }
          Write-Host "Downloading $zip"
          Invoke-WebRequest ($base + $zip) -OutFile vlc.zip -UseBasicParsing
          Write-Host "SHA256 $((Get-FileHash vlc.zip -Algorithm SHA256).Hash)"
          Expand-Archive vlc.zip -DestinationPath vlc-unpacked
          Move-Item (Get-ChildItem vlc-unpacked -Directory | Select-Object -First 1).FullName vlc
          # Ultra Stalker drives VLC itself: its own windows, skins and translations
          # aren't needed (English replies are what the program reads).
          foreach ($d in "locale", "skins", "sdk", "plugins\gui", "plugins\visualization") {
            if (Test-Path "vlc\$d") { Remove-Item -Recurse -Force "vlc\$d" }
          }
          Get-ChildItem vlc -Filter *.exe | Where-Object { $_.Name -notin "vlc.exe", "vlc-cache-gen.exe" } | Remove-Item -Force
          & .\vlc\vlc-cache-gen.exe .\vlc\plugins
          if (-not (Test-Path "vlc\plugins\control\liboldrc_plugin.dll")) { throw "VLC remote control module missing" }
          $mb = [math]::Round(((Get-ChildItem vlc -Recurse | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "VLC folder: $mb MB"

      - name: Self-test - VLC plays inside the program window on Windows
        id: selftest
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        env:
          US_SELFTEST: ${{ runner.temp }}\selftest
        run: |
          Remove-Item -Recurse -Force "$env:APPDATA\Ultra Stalker" -ErrorAction SilentlyContinue
          $env:US_SELFTEST_FILE = (Resolve-Path tests\fixtures\hevc-mp2.ts).Path
          npx electron . 2>&1 | Select-String "SELFTEST"
          $code = $LASTEXITCODE
          if (Test-Path "$env:US_SELFTEST\result.json") { Get-Content "$env:US_SELFTEST\result.json" -Raw | Write-Host }
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: ${{ runner.temp }}/selftest
          if-no-files-found: ignore

      - name: Build the installer
        env:
          ULTRASTALKER_DIR: ultrastalker-src
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Self-test the installed program (like a first start on a user's PC)
        id: installed
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          Start-Process $setup -ArgumentList "/S" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Ultra Stalker\Ultra Stalker.exe"
          if (-not (Test-Path $app)) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Depth 1 | ForEach-Object FullName; throw "not installed" }
          Remove-Item -Recurse -Force "$env:APPDATA\Ultra Stalker" -ErrorAction SilentlyContinue
          $env:US_SELFTEST = "$env:RUNNER_TEMP\selftest-installed"
          $env:US_SELFTEST_FILE = (Resolve-Path tests\fixtures\hevc-mp2.ts).Path
          $p = Start-Process $app -PassThru -Wait
          if (Test-Path "$env:US_SELFTEST\result.json") { Get-Content "$env:US_SELFTEST\result.json" -Raw | Write-Host }
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-installed
          path: ${{ runner.temp }}/selftest-installed
          if-no-files-found: ignore

      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Tee-Object -FilePath "$($_.FullName).sha256.txt"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: UltraStalker-Windows
          path: |
            dist/*.exe
            dist/*.sha256.txt
            dist/*.blockmap
            dist/latest.yml
          retention-days: 30

      # The programs already installed find this release and update themselves
      # (latest.yml names the installer and its checksum). Only a version that passed the
      # installed self-test, only from v2, and each version once.
      - name: Publish the update
        if: github.ref == 'refs/heads/v2' && steps.installed.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "v$v is already published"; exit 0 }
          if (-not (Test-Path dist\latest.yml)) { throw "latest.yml missing" }
          gh release create "v$v" "dist\UltraStalker-Setup-$v.exe" "dist\UltraStalker-Setup-$v.exe.blockmap" dist\latest.yml `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Ultra Stalker $v" `
            --notes "Ultra Stalker for Windows $v. Installed programs update themselves; new installs: download UltraStalker-Setup-$v.exe."
          if ($LASTEXITCODE -ne 0) { throw "release failed" }

