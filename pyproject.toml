[project]
name = "ultrastalker-desktop"
version = "0.1.0"
description = "Ultra Stalker Desktop for Windows"
requires-python = ">=3.11,<3.15"
authors = [{name = "Ahmed L-HadarY"}]
dependencies = [
  "PySide6>=6.7,<7",
  "requests>=2.32,<3",
  "keyring>=25,<26",
  "pywin32-ctypes>=0.2.0,<1; sys_platform == 'win32'"
]

[project.scripts]
ultrastalker-desktop = "ultrastalker_desktop.main:main"
